    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .prose-styles p,
        .prose-styles ul,
        .prose-styles ol {
            margin-bottom: 1rem;
        }

        .prose-styles ul {
            list-style-type: disc;
            padding-left: 1.5rem;
        }

        .prose-styles a {
            color: #4f46e5;
            text-decoration: underline;
        }

        .thumbnail {
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .thumbnail.active {
            border-color: #000000;
        }

        .thumbnail:hover {
            border-color: #9ca3af;
        }

        .rating {
            display: inline-block;
        }

        .rating input {
            display: none;
        }

        .rating label {
            float: right;
            cursor: pointer;
            color: #d1d5db;
            transition: color 0.2s;
        }

        .rating label:before {
            content: '★';
            font-size: 2rem;
        }

        .rating input:checked~label,
        .rating label:hover,
        .rating label:hover~label {
            color: #f59e0b;
        }

        #toast-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            transition: top 0.5s ease-in-out;
            z-index: 1000;
        }

        #toast-notification.show {
            top: 20px;
        }        
    </style>

                    <div class="space-y-6">

                        <div class="h-6 w-1/4 bg-gray-300 rounded"></div>
                        <div class="h-10 w-1/2 bg-gray-300 rounded"></div>
                        <div class="h-12 w-full bg-gray-300 rounded-md"></div>
                        <div class="h-12 w-full bg-gray-300 rounded-md"></div>
                    </div>
                </div>
            </div>
            <div id="product-container" class="opacity-0 transition-opacity duration-500">

            <div id="reviews-section-placeholder"></div>

            <div id="related-products-section" class="mt-16 pt-8 border-t hidden">
