<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - MoreTrendz</title>
    <link rel="icon" type="image/png" href="/Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .prose-styles p, .prose-styles ul, .prose-styles ol { margin-bottom: 1rem; }
        .prose-styles ul { list-style-type: disc; padding-left: 1.5rem; }
        .prose-styles a { color: #4f46e5; text-decoration: underline; }
        .thumbnail { cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
        .thumbnail.active { border-color: #000000; }
        .thumbnail:hover { border-color: #9ca3af; }
        .rating { display: inline-block; }
        .rating input { display: none; }
        .rating label { float: right; cursor: pointer; color: #d1d5db; transition: color 0.2s; }
        .rating label:before { content: '★'; font-size: 2rem; }
        .rating input:checked ~ label, .rating label:hover, .rating label:hover ~ label { color: #f59e0b; }
    </style>

</head>
<body class="bg-white">

    <div class="flex flex-col min-h-screen">
            <header id="header-placeholder"></header>

    <main id="page-container" class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <div id="product-container">
            <p id="loading-message" class="text-center text-gray-500">Loading product...</p>
        </div>

        <section id="reviews-section" class="py-16 sm:py-24 bg-gray-50">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-3xl">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-bold tracking-tight text-black">Customer Reviews</h2>
                    <button id="show-review-form-btn" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500">Write a Review</button>
                </div>
                
                <div id="review-form-container" class="hidden mt-8">
                    <form id="add-review-form" class="bg-white p-6 rounded-lg shadow-md space-y-4">
                        <h3 class="text-lg font-semibold">Write a review</h3>
                        <div>
                            <label for="review-author" class="block text-sm font-medium">Your Name</label>
                            <input type="text" id="review-author" required class="w-full border p-2 mt-1 rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Your Rating</label>
                            <div class="rating mt-1">
                                <input type="radio" id="star5" name="rating" value="5" required/><label for="star5"></label>
                                <input type="radio" id="star4" name="rating" value="4"/><label for="star4"></label>
                                <input type="radio" id="star3" name="rating" value="3"/><label for="star3"></label>
                                <input type="radio" id="star2" name="rating" value="2"/><label for="star2"></label>
                                <input type="radio" id="star1" name="rating" value="1"/><label for="star1"></label>
                            </div>
                        </div>
                        <div>
                            <label for="review-text" class="block text-sm font-medium">Your Review</label>
                            <textarea id="review-text" rows="4" required class="w-full border p-2 mt-1 rounded-md"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-black text-white font-semibold py-2 px-4 rounded-md hover:bg-gray-800">Submit Review</button>
                    </form>
                </div>

                <div id="reviews-list" class="mt-12 space-y-8">
                    </div>
            </div>
        </section>

        <div id="related-products-section" class="mt-16 pt-8 border-t hidden">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">You Might Also Like</h2>
            <div id="related-products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-10"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    </div>

    <script>
        let currentProduct = null;

        function initializePageScripts() {
            fetchProductDetails();
        }

        async function fetchProductDetails() {
            const container = document.getElementById('product-container');
            const loadingMessage = document.getElementById('loading-message');
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (!productId) { container.innerHTML = '<p class="text-center text-red-500">No product ID provided.</p>'; return; }
            try {
                const response = await fetch(`https://moretrendz-backend.onrender.com/api/products/${productId}`);
                if (!response.ok) throw new Error('Product not found');
                const data = await response.json();
                currentProduct = data.product;
                loadingMessage.style.display = 'none';
                displayProduct(data.product);
                fetchReviews(productId);
                displayRelatedProducts(data.relatedProducts);
            } catch (error) {
                console.error('Error fetching product details:', error);
                container.innerHTML = `<p class="text-center text-red-500">Error: ${error.message}. Please try again.</p>`;
            }
        }

        function displayProduct(product) {
            // ... (This function is unchanged)
            const container = document.getElementById('product-container');
            let thumbnailsHTML = '';
            product.media.forEach((item, index) => { thumbnailsHTML += `<div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeMedia(${index})">${item.type === 'image' ? `<img src="${item.url}" alt="Thumbnail ${index + 1}" class="w-full h-20 object-cover rounded-md">` : `<div class="w-full h-20 bg-black flex items-center justify-center rounded-md"><i data-lucide="video" class="w-6 h-6 text-white"></i></div>`}</div>`; });
            const productHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12"><div class="flex flex-col-reverse md:flex-row gap-4"><div class="flex md:flex-col gap-2 overflow-x-auto md:overflow-x-hidden">${thumbnailsHTML}</div><div id="main-media-display" class="flex-1 aspect-w-1 aspect-h-1"></div></div><div class="flex flex-col justify-center"><h1 class="text-3xl lg:text-4xl font-bold text-gray-800">${product.name}</h1><div class="mt-4 flex items-center"><div id="product-stars-container" class="flex items-center"></div><a href="#reviews-section" id="review-count-link" class="ml-3 text-sm font-medium text-indigo-600 hover:text-indigo-500"></a></div><p class="text-3xl text-gray-900 mt-4">₹${product.price.toFixed(2)}</p><div class="mt-6 border-t pt-6"><div class="flex items-center space-x-4 mb-4"><label class="font-medium">Quantity:</label><div class="flex items-center border rounded-md"><button onclick="updateQuantity(-1)" class="px-3 py-1 text-lg">-</button><span id="quantity-display" class="px-4 py-1">1</span><button onclick="updateQuantity(1)" class="px-3 py-1 text-lg">+</button></div></div><button onclick="addToCart()" class="w-full bg-gray-800 text-white font-bold py-3 px-8 rounded-md hover:bg-black transition-colors mb-3">Add to Cart</button><div class="grid grid-cols-2 gap-3"><button onclick="buyNow('COD')" class="w-full bg-blue-600 text-white font-bold py-3 px-8 rounded-md hover:bg-blue-700 transition-colors">Buy with COD</button><button onclick="buyNow('Online')" class="w-full bg-green-600 text-white font-bold py-3 px-8 rounded-md hover:bg-green-700 transition-colors">Prepaid (15% OFF)</button></div></div><div class="mt-8 border-t pt-6"><h2 class="text-lg font-semibold text-gray-800 mb-2">Description</h2><div class="prose-styles text-gray-600">${product.description}</div></div></div></div>`;
            container.innerHTML = productHTML;
            changeMedia(0);
            lucide.createIcons();
        }

        function renderStars(rating) {
            // ... (This function is unchanged)
            let stars = '';
            for (let i = 1; i <= 5; i++) { stars += `<svg class="w-5 h-5 ${i <= rating ? 'text-yellow-400' : 'text-gray-300'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.367 2.445a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.367-2.445a1 1 0 00-1.175 0l-3.367 2.445c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>`; }
            return `<div class="flex items-center">${stars}</div>`;
        }

        async function fetchReviews(productId) {
            const reviewsList = document.getElementById('reviews-list');
            const reviewFormContainer = document.getElementById('review-form-container');
            const showReviewFormBtn = document.getElementById('show-review-form-btn');
            const reviewCountLink = document.getElementById('review-count-link');
            const starsContainer = document.getElementById('product-stars-container');

            // NEW: Event listener for the "Write a Review" button
            showReviewFormBtn.addEventListener('click', () => {
                reviewFormContainer.classList.toggle('hidden');
            });

            try {
                const response = await fetch(`https://moretrendz-backend.onrender.com/api/reviews/product/${productId}`);
                if (!response.ok) throw new Error('Could not load reviews.');
                const reviews = await response.json();
                
                if (reviewCountLink) { reviewCountLink.textContent = `${reviews.length} reviews`; }
                
                reviewsList.innerHTML = ''; // Clear previous content
                if (reviews.length === 0) {
                    reviewsList.innerHTML = `<p class="text-center text-gray-500">There are no reviews yet.</p>`;
                    if (starsContainer) starsContainer.innerHTML = '<span class="text-sm text-gray-500">No reviews yet</span>';
                } else {
                    let totalRating = 0;
                    reviews.forEach(review => {
                        totalRating += review.rating;
                        const reviewCard = `<div class="p-6 bg-white rounded-lg shadow"><div class="flex items-center justify-between"><p class="text-lg font-bold">${review.author}</p>${renderStars(review.rating)}</div><p class="mt-4 text-gray-600">${review.text}</p></div>`;
                        reviewsList.innerHTML += reviewCard;
                    });
                    const avgRating = totalRating / reviews.length;
                    if (starsContainer) starsContainer.innerHTML = renderStars(avgRating);
                }
            } catch (error) {
                console.error("Failed to fetch reviews:", error);
                reviewsList.innerHTML = `<p class="text-center text-red-500">${error.message}</p>`;
            }
        }
        
        document.addEventListener('submit', async function(event) {
            if (event.target.id === 'add-review-form') {
                event.preventDefault();
                const form = event.target;
                const author = form.elements['review-author'].value;
                const rating = form.elements['rating'].value;
                const text = form.elements['review-text'].value;
                const productId = new URLSearchParams(window.location.search).get('id');

                if (!rating) { alert('Please select a star rating.'); return; }

                try {
                    const response = await fetch('https://moretrendz-backend.onrender.com/api/reviews', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ productId, author, rating, text })
                    });
                    if (!response.ok) throw new Error('Failed to submit review.');
                    alert('Thank you! Your review has been submitted.');
                    form.reset();
                    document.getElementById('review-form-container').classList.add('hidden'); // Hide form after submission
                    fetchReviews(productId); // Refresh the reviews list
                } catch (error) {
                    alert(error.message);
                }
            }
        });

        // --- Other functions are unchanged ---
        function displayRelatedProducts(products) {
            const section = document.getElementById('related-products-section');
            const grid = document.getElementById('related-products-grid');
            if (!products || products.length === 0) return;
            grid.innerHTML = '';
            products.forEach(product => { const imageUrl = (product.media && product.media.length > 0) ? product.media[0].url : 'https://placehold.co/600x750/E2E8F0/111827?text=Image'; const cardHTML = `<a href="./product.html?id=${product._id}" class="group"><div class="aspect-w-1 aspect-h-1 w-full overflow-hidden rounded-lg bg-gray-200"><img src="${imageUrl}" alt="${product.name}" class="h-full w-full object-cover object-center group-hover:opacity-75"></div><h3 class="mt-4 text-sm text-gray-700">${product.name}</h3><p class="mt-1 text-lg font-medium text-gray-900">₹${product.price.toFixed(2)}</p></a>`; grid.innerHTML += cardHTML; });
            section.classList.remove('hidden');
        }
        function changeMedia(index) {
            const mainDisplay = document.getElementById('main-media-display');
            if (!currentProduct || !currentProduct.media || !currentProduct.media[index]) return;
            const mediaItem = currentProduct.media[index];
            if (mediaItem.type === 'image') { mainDisplay.innerHTML = `<img src="${mediaItem.url}" alt="${currentProduct.name}" class="w-full h-full object-cover rounded-lg shadow-md">`; } else { const videoId = mediaItem.url.split('v=')[1]?.split('&')[0] || mediaItem.url.split('/').pop(); mainDisplay.innerHTML = `<div class="aspect-w-16 aspect-h-9"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="w-full h-full rounded-lg shadow-md"></iframe></div>`; }
            document.querySelectorAll('.thumbnail').forEach((el, i) => { el.classList.toggle('active', i === index); });
        }
        function updateQuantity(change) { const quantityEl = document.getElementById('quantity-display'); let currentQuantity = parseInt(quantityEl.textContent); if (currentQuantity + change >= 1) { quantityEl.textContent = currentQuantity + change; } }
function addToCart() {
    if (!currentProduct) return;
    const quantity = parseInt(document.getElementById('quantity-display').textContent);
    
    // Get the existing cart from localStorage, or create an empty one
    let cart = JSON.parse(localStorage.getItem('moreTrendzCart')) || [];
    
    // Check if the product is already in the cart
    const existingProductIndex = cart.findIndex(item => item._id === currentProduct._id);

    if (existingProductIndex !== -1) {
        // If it exists, just increase the quantity
        cart[existingProductIndex].quantity += quantity;
    } else {
        // If it's a new product, add it to the cart
        cart.push({
            _id: currentProduct._id,
            name: currentProduct.name,
            price: currentProduct.price,
            imageURL: currentProduct.media[0].url,

            quantity: quantity
        });
    }

    // Save the updated cart back to localStorage
    localStorage.setItem('moreTrendzCart', JSON.stringify(cart));

    // Send the message to main.js to show the notification
    window.parent.postMessage({ type: 'cartUpdated', message: `${quantity} x ${currentProduct.name} added to cart!` }, '*');
}
        function buyNow(method) {
            if (!currentProduct) return;
            localStorage.removeItem('moreTrendzDiscount');
            if (method === 'Online') { localStorage.setItem('moreTrendzPrepaidDiscount', 'true'); }
            const quantity = parseInt(document.getElementById('quantity-display').textContent);
            const cart = [{ _id: currentProduct._id, name: currentProduct.name, price: currentProduct.price, imageURL: currentProduct.media[0].url, quantity: quantity }];
            localStorage.setItem('moreTrendzCart', JSON.stringify(cart));
            window.location.href = './checkout.html';
        }

    </script>
    <script type="module" src="/js/main.js" defer></script>
</body>
</html>
