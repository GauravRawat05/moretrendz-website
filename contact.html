<body class="bg-white">
    <div id="common-elements-placeholder"></div>

<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1774275046853349&ev=PageView&noscript=1"
/></noscript>
    <div class="flex flex-col min-h-screen">
    <header id="header-placeholder"></header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl font-bold text-gray-900">Get In Touch</h1>
            <p class="mt-4 text-lg text-gray-600">Have a question or a comment? We'd love to hear from you.</p>
        </div>

        <div class="mt-12 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 bg-gray-50 p-8 rounded-lg">
            <!-- Contact Information -->
            <div class="space-y-6">
                <div>
                    <h2 class="text-xl font-semibold text-gray-800">Contact Information</h2>
                    <p class="mt-2 text-gray-600">Fill out the form and our team will get back to you within 24 hours.</p>
                </div>
                <div class="flex items-center space-x-3">
                    <i data-lucide="phone" class="w-5 h-5 text-gray-500"></i>
                    <span class="text-gray-700">+91 9319810682</span>
                </div>
                <div class="flex items-center space-x-3">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-500"></i>
                    <span class="text-gray-700">moretrendz24x7@gmail.com</span>
                </div>
                <div class="flex items-center space-x-3">
                    <i data-lucide="map-pin" class="w-5 h-5 text-gray-500"></i>
                    <span class="text-gray-700">Faridabad, India</span>
                </div>
            </div>

            <!-- Contact Form -->
            <div>
                <form id="contact-form">
                    <div class="space-y-6">
                        <div>
                            <label for="contact-name" class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" id="contact-name" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="contact-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input type="email" id="contact-email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="contact-message" class="block text-sm font-medium text-gray-700">Message</label>
                            <textarea id="contact-message" name="message" rows="4" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="bg-black hover:bg-gray-800 text-white font-bold py-2 px-6 rounded-md transition-colors">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const contactForm = document.getElementById('contact-form');
            contactForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Thank you for your message! We will get back to you shortly.');
                contactForm.reset();
            });
        });
    </script>
    <script type="module" src="/js/main.js" defer></script>
</body>
</html>
