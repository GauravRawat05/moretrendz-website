        }

<body class="bg-white">
    <div id="common-elements-placeholder"></div>

    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1774275046853349&ev=PageView&noscript=1" /></noscript>
    <div class="flex flex-col min-h-screen">
        <header id="header-placeholder"></header>

        <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-xl mx-auto">
                <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Contact Us</h1>
                <form id="contact-form" class="space-y-6">
                    <div><label for="name" class="block text-sm font-medium">Full Name</label><input type="text" id="name" required class="w-full border p-2 mt-1 rounded-md"></div>
                    <div><label for="email" class="block text-sm font-medium">Email Address</label><input type="email" id="email" required class="w-full border p-2 mt-1 rounded-md"></div>
                    <div><label for="message" class="block text-sm font-medium">Message</label><textarea id="message" rows="5" required class="w-full border p-2 mt-1 rounded-md"></textarea></div>
                    <button type="submit" class="w-full bg-black text-white font-bold py-3 px-8 rounded-md hover:bg-gray-800">Send Message</button>
                </form>
            </div>
        </main>
        <div id="faq-placeholder"></div>
        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const form = event.target;
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            const formData = {
                name: form.elements.name.value,
                email: form.elements.email.value,
                message: form.elements.message.value
            };

            try {
                const response = await fetch('https://moretrendz-backend.onrender.com/api/contact/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (!response.ok) throw new Error('Failed to send message.');
                
                window.showModal('Message Sent!', 'Thanks for reaching out. We will get back to you shortly.');
                form.reset();
            } catch (error) {
                window.showModal('Error', error.message, 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Send Message';
            }
        });
    </script>
    <script type="module" src="/js/main.js" defer></script>
</body>

</html>
