<div id="toast-notification" class="hidden items-center w-full max-w-xs p-4 space-x-4 text-gray-500 bg-white divide-x divide-gray-200 rounded-lg shadow-lg" role="alert">
    <div id="toast-icon" class="text-green-500"><i data-lucide="check-circle" class="w-6 h-6"></i></div>
    <div id="toast-message" class="pl-4 text-sm font-normal">Message goes here.</div>
</div>

<div id="search-overlay" class="fixed inset-0 z-[60] bg-black bg-opacity-50 hidden opacity-0 flex items-start justify-center pt-20">
    <div class="w-full max-w-xl p-4">
        <form id="search-form-overlay" action="./search-results.html" method="GET" class="relative">
            <input type="search" name="q" placeholder="Search for products..." class="w-full px-6 py-4 border border-gray-300 rounded-md text-lg focus:outline-none focus:ring-2 focus:ring-white">
            <button type="submit" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-black" aria-label="Submit search">
                <i data-lucide="search" class="w-6 h-6" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</div>

<div id="generic-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
    <div id="generic-modal-content" class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm text-center transform scale-95 transition-transform duration-300">
        <h2 id="generic-modal-title" class="text-xl font-bold text-gray-800 mb-2"></h2>
        <p id="generic-modal-message" class="text-gray-600 mb-4"></p>
        <button onclick="closeModal()" class="bg-black text-white font-semibold py-2 px-6 rounded-md hover:bg-gray-800">OK</button>
    </div>
</div>
