<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MoreTrendz</title>
    <link rel="icon" type="image/png" href="/Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg" />
    <link rel="shortcut icon" href="/Favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/Favicon/site.webmanifest" />
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        #description-editor { height: 250px; }
        .media-item { position: relative; overflow: hidden; border-radius: 0.375rem; border: 1px solid #e5e7eb; }
        .media-item .remove-btn { position: absolute; top: 0.25rem; right: 0.25rem; background-color: rgba(0,0,0,0.6); color: white; border-radius: 9999px; width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .media-item:hover .remove-btn { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100">
    <script>
        const token = localStorage.getItem('adminToken');

        if (!token) {
            // No token? Send back to login
            window.location.href = 'admin_login.html';
        } else {
            // OPTIONAL: Validate token with backend (optional)
            fetch('https://moretrendz-backend.onrender.com/api/admin-protected', {
            method: 'GET',
            headers: {
                Authorization: 'Bearer ' + token
            }
            })
            .then(res => {
            if (!res.ok) {
                localStorage.removeItem('adminToken');
                window.location.href = 'admin_login.html';
            }
            })
            .catch(err => {
            console.error('Token check failed:', err);
            window.location.href = 'admin_login.html';
            });
        }
    </script>


    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Admin Dashboard</h1>

        <!-- Add Product Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Add New Product</h2>
            <form id="add-product-form">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label for="name" class="block text-sm font-medium text-gray-700">Product Name</label><input type="text" id="name" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                    <div><label for="price" class="block text-sm font-medium text-gray-700">Price (₹)</label><input type="number" id="price" name="price" step="0.01" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                </div>
                <div class="mt-6">
                    <div class="flex justify-between items-center"><label class="block text-sm font-medium text-gray-700">Description</label><button type="button" onclick="generateAiDescription()" class="text-sm bg-purple-100 text-purple-700 font-semibold py-1 px-3 rounded-md hover:bg-purple-200">✨ Generate with AI</button></div>
                    <div id="description-editor" class="mt-1"></div>
                </div>
                <div class="mt-6">
                    <label class="block text-sm font-medium text-gray-700">Product Media</label>
                    <p class="text-xs text-gray-500 mt-1">Upload images or paste video URLs. The first item must be an image.</p>
                    <div class="mt-2 flex items-center space-x-2"><input type="file" id="imageFile" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100"></div>
                    <div id="upload-status" class="text-sm mt-2"></div>
                    <div class="mt-4 flex items-center space-x-2"><input type="url" id="media-url" placeholder="Paste video URL here and click Add" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"><button type="button" id="add-media-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md">Add</button></div>
                    <div id="media-preview-container" class="mt-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4"></div>
                </div>
                <div class="mt-6">
                    <div class="flex items-center">
                        <input id="isFeatured" name="isFeatured" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="isFeatured" class="ml-2 block text-sm text-gray-900">Feature this product on the homepage banner</label>
                    </div>
                </div>
                <div class="mt-6 text-right"><button type="submit" class="w-full sm:w-auto bg-black hover:bg-gray-800 text-white font-bold py-2 px-6 rounded-md transition-colors">Add Product</button></div>
            </form>
        </div>

        <!-- Manage Products Table -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Manage Products</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th></tr></thead>
                    <tbody id="products-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <!-- DISCOUNT CODE MANAGEMENT -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Manage Discount Codes</h2>
            <form id="add-discount-form" class="flex items-end space-x-4 mb-6">
                <div>
                    <label for="discount-code" class="block text-sm font-medium text-gray-700">Discount Code</label>
                    <input type="text" id="discount-code" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm uppercase">
                </div>
                <div>
                    <label for="discount-percentage" class="block text-sm font-medium text-gray-700">Percentage (%)</label>
                    <input type="number" id="discount-percentage" min="1" max="100" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">Create Code</button>
            </form>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Discount</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="discounts-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <!-- Order Management Dashboard -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Order Management</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th></tr></thead>
                    <tbody id="orders-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        // --- CONFIG & GLOBAL VARIABLES ---
        const PRODUCT_API_URL = 'https://moretrendz-backend.onrender.com/api/products';
        const ORDER_API_URL = 'https://moretrendz-backend.onrender.com/api/orders';
        const DISCOUNT_API_URL = 'https://moretrendz-backend.onrender.com/api/discounts';
        const AI_API_URL = 'https://moretrendz-backend.onrender.com/api/ai';
        const IMGBB_API_KEY = 'b035db98a2598b85ecae1d68f28207e8';
        let mediaItems = [];

        // --- DOM ELEMENTS ---
        const addProductForm = document.getElementById('add-product-form');
        const addDiscountForm = document.getElementById('add-discount-form');
        const productsTableBody = document.getElementById('products-table-body');
        const ordersTableBody = document.getElementById('orders-table-body');
        const discountsTableBody = document.getElementById('discounts-table-body');
        const imageFileInput = document.getElementById('imageFile');
        const uploadStatus = document.getElementById('upload-status');
        const mediaUrlInput = document.getElementById('media-url');
        const addMediaBtn = document.getElementById('add-media-btn');
        const mediaPreviewContainer = document.getElementById('media-preview-container');

        const quill = new Quill('#description-editor', { theme: 'snow', modules: { toolbar: [['bold', 'italic', 'underline'], ['link', 'image', 'video'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean']] } });

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndDisplayProducts();
            fetchAndDisplayOrders();
            fetchAndDisplayDiscounts();
        });
        addProductForm.addEventListener('submit', handleAddProduct);
        addDiscountForm.addEventListener('submit', handleAddDiscount);
        addMediaBtn.addEventListener('click', handleAddMediaUrl);
        imageFileInput.addEventListener('change', handleImageFileUpload);

        // --- PRODUCT FUNCTIONS ---
        async function handleAddProduct(e) { e.preventDefault(); const name = document.getElementById('name').value; const price = document.getElementById('price').value; const description = quill.root.innerHTML; const isFeatured = document.getElementById('isFeatured').checked; if (!name || !price || mediaItems.length === 0 || description === '<p><br></p>') { alert('Please fill out all fields and add at least one media item.'); return; } if (mediaItems[0].type !== 'image') { alert('The first media item must be an image.'); return; } const productData = { name, price, description, media: mediaItems, isFeatured }; try { const response = await fetch(PRODUCT_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(productData) }); if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.message || 'Failed to add product'); } addProductForm.reset(); quill.root.innerHTML = ''; mediaItems = []; renderMediaPreviews(); fetchAndDisplayProducts(); } catch (error) { console.error('Error adding product:', error); alert(`Could not add product: ${error.message}`); } }
        async function fetchAndDisplayProducts() { try { const response = await fetch(PRODUCT_API_URL); const data = await response.json(); const products = data.products || []; productsTableBody.innerHTML = ''; if (products.length === 0) { productsTableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4">No products found.</td></tr>'; return; } products.forEach(product => { const imageUrl = (product.media && product.media.length > 0) ? product.media[0].url : 'https://placehold.co/40x40/E2E8F0/111827?text=?'; const row = `<tr><td class="px-6 py-4 whitespace-nowrap"><div class="flex items-center"><div class="flex-shrink-0 h-10 w-10"><img class="h-10 w-10 rounded-full object-cover" src="${imageUrl}" alt=""></div><div class="ml-4"><div class="text-sm font-medium text-gray-900">${product.name}</div></div></div></td><td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-900">₹${product.price.toFixed(2)}</div></td><td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"><button onclick="deleteProduct('${product._id}')" class="text-red-600 hover:text-red-900">Delete</button></td></tr>`; productsTableBody.innerHTML += row; }); } catch (error) { console.error('Error fetching products:', error); productsTableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-red-500">Error loading products.</td></tr>'; } }
        async function deleteProduct(productId) { if (!confirm('Are you sure you want to delete this product?')) return; try { const response = await fetch(`${PRODUCT_API_URL}/${productId}`, { method: 'DELETE' }); if (!response.ok) throw new Error('Failed to delete product'); fetchAndDisplayProducts(); } catch (error) { console.error('Error deleting product:', error); alert('Could not delete product.'); } }
        
        // --- DISCOUNT CODE FUNCTIONS ---
        async function handleAddDiscount(e) { e.preventDefault(); const codeInput = document.getElementById('discount-code'); const percentageInput = document.getElementById('discount-percentage'); const discountData = { code: codeInput.value, discountPercentage: percentageInput.value }; try { const response = await fetch(DISCOUNT_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(discountData) }); if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.message || 'Failed to create code'); } addDiscountForm.reset(); fetchAndDisplayDiscounts(); } catch (error) { console.error('Error adding discount:', error); alert(`Could not create discount code: ${error.message}`); } }
        async function fetchAndDisplayDiscounts() { try { const response = await fetch(DISCOUNT_API_URL); const discounts = await response.json(); discountsTableBody.innerHTML = ''; if (discounts.length === 0) { discountsTableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4">No discount codes found.</td></tr>'; return; } discounts.forEach(discount => { const row = `<tr><td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${discount.code}</td><td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${discount.discountPercentage}%</td><td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"><button onclick="deleteDiscount('${discount._id}')" class="text-red-600 hover:text-red-900">Delete</button></td></tr>`; discountsTableBody.innerHTML += row; }); } catch (error) { console.error('Error fetching discounts:', error); discountsTableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-red-500">Error loading codes.</td></tr>'; } }
        async function deleteDiscount(discountId) { if (!confirm('Are you sure you want to delete this discount code?')) return; try { const response = await fetch(`${DISCOUNT_API_URL}/${discountId}`, { method: 'DELETE' }); if (!response.ok) throw new Error('Failed to delete discount code'); fetchAndDisplayDiscounts(); } catch (error) { console.error('Error deleting discount:', error); alert('Could not delete discount code.'); } }
        
        // --- ORDER FUNCTIONS ---
        async function fetchAndDisplayOrders() { try { const response = await fetch(ORDER_API_URL); const orders = await response.json(); ordersTableBody.innerHTML = ''; if (orders.length === 0) { ordersTableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No orders found.</td></tr>'; return; } orders.forEach(order => { const statusColor = getStatusColor(order.paymentStatus); const row = `<tr><td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order._id}</td><td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-medium text-gray-900">${order.shippingDetails.name}</div><div class="text-sm text-gray-500">${order.shippingDetails.email}</div></td><td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">₹${order.totalAmount.toFixed(2)}</td><td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">${order.paymentStatus}</span></td><td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"><select onchange="updateOrderStatus('${order._id}', this.value)" class="p-1 border rounded-md"><option value="Processing" ${order.paymentStatus === 'Processing' ? 'selected' : ''}>Processing</option><option value="Paid" ${order.paymentStatus === 'Paid' ? 'selected' : ''}>Paid</option><option value="Shipped" ${order.paymentStatus === 'Shipped' ? 'selected' : ''}>Shipped</option><option value="Delivered" ${order.paymentStatus === 'Delivered' ? 'selected' : ''}>Delivered</option><option value="Cancelled" ${order.paymentStatus === 'Cancelled' ? 'selected' : ''}>Cancelled</option></select></td></tr>`; ordersTableBody.innerHTML += row; }); } catch (error) { console.error('Error fetching orders:', error); ordersTableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-red-500">Error loading orders.</td></tr>'; } }
        async function updateOrderStatus(orderId, newStatus) { try { const response = await fetch(`${ORDER_API_URL}/${orderId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentStatus: newStatus }) }); if (!response.ok) throw new Error('Failed to update status'); fetchAndDisplayOrders(); } catch (error) { console.error('Error updating status:', error); alert('Could not update order status.'); } }
        function getStatusColor(status) { switch (status) { case 'Paid': case 'Delivered': return 'bg-green-100 text-green-800'; case 'Processing': case 'Shipped': return 'bg-yellow-100 text-yellow-800'; case 'Cancelled': return 'bg-red-100 text-red-800'; default: return 'bg-gray-100 text-gray-800'; } }
        
        // --- MEDIA & AI FUNCTIONS ---
        function handleAddMediaUrl() { const url = mediaUrlInput.value.trim(); if (!url) return; let type = (url.includes('youtube.com') || url.includes('youtu.be')) ? 'video' : 'image'; mediaItems.push({ type, url }); mediaUrlInput.value = ''; renderMediaPreviews(); }
        async function handleImageFileUpload(e) { const file = e.target.files[0]; if (!file) return; if (IMGBB_API_KEY === 'YOUR_IMGBB_API_KEY') { alert('Please add your ImgBB API key to the script first!'); return; } uploadStatus.textContent = 'Uploading image...'; const formData = new FormData(); formData.append('image', file); try { const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData }); const result = await response.json(); if (result.success) { mediaItems.push({ type: 'image', url: result.data.url }); renderMediaPreviews(); uploadStatus.textContent = 'Upload successful!'; } else { throw new Error(result.error.message); } } catch (error) { console.error('Image upload failed:', error); uploadStatus.textContent = `Upload failed: ${error.message}`; } finally { imageFileInput.value = ''; } }
        function renderMediaPreviews() { mediaPreviewContainer.innerHTML = ''; mediaItems.forEach((item, index) => { const previewEl = document.createElement('div'); previewEl.className = 'media-item'; let contentHTML = item.type === 'image' ? `<img src="${item.url}" class="w-full h-24 object-cover">` : `<div class="w-full h-24 bg-black flex items-center justify-center"><i data-lucide="video" class="w-8 h-8 text-white"></i></div>`; previewEl.innerHTML = `${contentHTML}<div class="remove-btn" onclick="removeMediaItem(${index})"><i data-lucide="x" class="w-4 h-4"></i></div>${index === 0 ? '<div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-50 text-white text-xs text-center py-0.5">Cover</div>' : ''}`; mediaPreviewContainer.appendChild(previewEl); }); lucide.createIcons(); }
        function removeMediaItem(index) { mediaItems.splice(index, 1); renderMediaPreviews(); }
        async function generateAiDescription() { const productName = document.getElementById('name').value; if (!productName) { alert('Please enter a Product Name first!'); return; } quill.root.innerHTML = '<p>✨ Generating a creative description for you...</p>'; try { const response = await fetch(`${AI_API_URL}/generate-description`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productName }) }); if (!response.ok) { throw new Error('Failed to get description from AI.'); } const data = await response.json(); quill.root.innerHTML = data.description; } catch (error) { console.error("Error generating AI description:", error); quill.root.innerHTML = '<p>Sorry, the AI writer is unavailable. Please try again.</p>'; } }
    </script>

    <button onclick="logout()">Logout</button>
    <script>
        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin_login.html';
        }
    </script>

</body>
</html>
