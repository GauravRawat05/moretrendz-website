<body class="bg-gray-100">
    <div id="common-elements-placeholder"></div>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1774275046853349&ev=PageView&noscript=1" /></noscript>

    <div class="flex flex-col min-h-screen">
        <header id="header-placeholder"></header>

        <main class="flex-grow">
            <div class="container mx-auto p-4 sm:p-6 lg:p-8">
                <div class="text-center mb-8">
                    <a href="./index.html" class="text-3xl font-bold tracking-wider text-black">MORETRENDZ</a>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">
                    <!-- Left Side: Shipping & Payment -->
                    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md">
                        <form id="checkout-form">
                            <h2 class="text-2xl font-semibold mb-6">Shipping Information</h2>
                            <div class="grid grid-cols-1 gap-6">
                                <div><label for="email" class="block text-sm font-medium text-gray-700">Email
                                        Address</label><input type="email" id="email" name="email" required
                                        autocomplete="email"
                                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div><label for="name" class="block text-sm font-medium text-gray-700">Full
                                        Name</label><input type="text" id="name" name="name" required
                                        autocomplete="name"
                                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div><label for="address" class="block text-sm font-medium text-gray-700">Shipping
                                        Address</label><input type="text" id="address" name="address" required
                                        autocomplete="street-address"
                                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div><label for="city"
                                            class="block text-sm font-medium text-gray-700">City</label><input
                                            type="text" id="city" name="city" required autocomplete="address-level2"
                                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                    <div><label for="pincode" class="block text-sm font-medium text-gray-700">PIN
                                            Code</label><input type="text" id="pincode" name="pincode" required
                                            autocomplete="postal-code"
                                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                </div>
                                <div><label for="phone" class="block text-sm font-medium text-gray-700">Phone
                                        Number</label><input type="tel" id="phone" name="phone" required
                                        autocomplete="tel"
                                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                            </div>
                            <div class="mt-8 border-t pt-6">
                                <h2 class="text-2xl font-semibold mb-4">Payment Method</h2>
                                <div class="space-y-4">
                                    <div class="flex items-center p-4 border rounded-md"><input id="payment-online"
                                            name="paymentMethod" type="radio" value="Online" checked
                                            class="h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-500"><label
                                            for="payment-online"
                                            class="ml-3 block text-sm font-medium text-gray-700">Online Payment (UPI,
                                            Cards, Netbanking)</label></div>
                                    <div class="flex items-center p-4 border rounded-md"><input id="payment-cod"
                                            name="paymentMethod" type="radio" value="COD"
                                            class="h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-500"><label
                                            for="payment-cod" class="ml-3 block text-sm font-medium text-gray-700">Cash
                                            on Delivery (COD)</label></div>
                                </div>
                            </div>
                            <div class="mt-8"><button type="submit"
                                    class="w-full bg-black text-white font-bold py-3 px-8 rounded-md hover:bg-gray-800 transition-colors">Place
                                    Order</button></div>
                        </form>
                    </div>

                    <!-- Right Side: Order Summary -->
                    <div class="bg-gray-50 p-6 sm:p-8 rounded-lg shadow-inner h-fit">
                        <h2 class="text-2xl font-semibold mb-6">Order Summary</h2>
                        <div id="order-summary-list" class="space-y-4"></div>

                        <div class="mt-6 border-t pt-6">
                            <div class="flex space-x-2">
                                <input type="text" id="discount-code-input" placeholder="Discount code"
                                    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm uppercase">
                                <button id="apply-discount-btn"
                                    class="bg-gray-600 text-white font-semibold px-4 rounded-md hover:bg-gray-700">Apply</button>
                            </div>
                            <p id="discount-message" class="text-sm mt-2"></p>
                        </div>

                        <div class="mt-6 border-t pt-6 space-y-2">
                            <div class="flex justify-between text-lg"><span>Subtotal</span><span
                                    id="summary-subtotal">₹0.00</span></div>
                            <div id="discount-display" class="flex justify-between text-lg text-green-600 hidden">
                                <span>Discount</span><span id="summary-discount">-₹0.00</span></div>
                            <div class="flex justify-between text-lg"><span>Shipping</span><span>FREE</span></div>
                            <div class="flex justify-between text-2xl font-bold mt-2"><span>Total</span><span
                                    id="summary-total">₹0.00</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="faq-placeholder"></div>
        <div id="footer-placeholder"></div>
    </div>

    <script type="module" src="/js/checkout.js"></script>
    <script type="module" src="/js/main.js" defer></script>
</body>

</html>
