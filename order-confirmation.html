    <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg" />

            font-family: 'Montserrat', sans-serif;
        }
    </style>

<body class="bg-gray-100">
    <div id="common-elements-placeholder"></div>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1774275046853349&ev=PageView&noscript=1" /></noscript>

    <div class="flex flex-col min-h-screen">
        <header id="header-placeholder"></header>

        <main class="flex-grow flex items-center justify-center">
            <div class="bg-white p-8 sm:p-12 rounded-lg shadow-xl text-center max-w-lg w-full">

                <!-- Success Message (hidden by default) -->
                <div id="success-message" class="hidden">
                    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100">
                        <i data-lucide="check" class="h-10 w-10 text-green-600"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mt-6">Thank You!</h1>
                    <p class="text-gray-600 mt-2">Your order has been placed successfully.</p>
                    <p class="text-gray-500 text-sm mt-4">Your Order ID is:</p>
                    <p id="order-id" class="text-lg font-semibold text-gray-800"></p>
                    <p class="text-gray-500 text-sm mt-4">You will receive an email confirmation shortly.</p>
                </div>

                <!-- Failure Message (hidden by default) -->
                <div id="failure-message" class="hidden">
                    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100">
                        <i data-lucide="x" class="h-10 w-10 text-red-600"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mt-6">Payment Failed</h1>
                    <p class="text-gray-600 mt-2">Unfortunately, we were unable to process your payment.</p>
                    <p class="text-gray-500 text-sm mt-4">Please try again or contact customer support if the problem
                        persists.</p>
                    <p id="failed-order-id" class="text-sm text-gray-500 mt-2"></p>
                </div>

                <div class="mt-8">
                    <a href="./index.html"
                        class="bg-black text-white font-bold py-3 px-8 rounded-md hover:bg-gray-800 transition-colors">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </main>
        <div id="faq-placeholder"></div>
        <!-- NEW: FOOTER SECTION -->
        <div id="footer-placeholder"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const orderId = urlParams.get('orderId');

            const successMessage = document.getElementById('success-message');
            const failureMessage = document.getElementById('failure-message');

            if (status === 'success' && orderId) {
                document.getElementById('order-id').textContent = `#${orderId}`;
                successMessage.classList.remove('hidden');
            } else {
                if (orderId) {
                    document.getElementById('failed-order-id').textContent = `(Reference Order ID: ${orderId})`;
                }
                failureMessage.classList.remove('hidden');
            }

            lucide.createIcons();
        });
    </script>
    <script type="module" src="/js/main.js" defer></script>
</body>

</html>
