<body class="bg-white">
    <div id="common-elements-placeholder"></div>

<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1774275046853349&ev=PageView&noscript=1"
/></noscript>
    <div class="flex flex-col min-h-screen">
            <header id="header-placeholder"></header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <h1 class="text-3xl font-bold text-gray-800">Search Results for "<span id="search-query"></span>"</h1>
        <p id="results-count" class="mt-2 text-gray-600"></p>
        
        <div id="results-grid" class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-10">
            <!-- Search results will be inserted here -->
        </div>
    </main>

    <div id="footer-placeholder"></div>
    </div>
        
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            performSearch();
            updateCartIcon();
            lucide.createIcons();
        });

        async function performSearch() {
            const grid = document.getElementById('results-grid');
            const querySpan = document.getElementById('search-query');
            const countP = document.getElementById('results-count');

            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (!query) {
                querySpan.textContent = '...';
                grid.innerHTML = '<p class="col-span-full text-center">Please enter a search term.</p>';
                return;
            }

            querySpan.textContent = query;
            grid.innerHTML = '<p class="col-span-full text-center">Searching...</p>';

            try {
                const response = await fetch(`https://moretrendz-backend.onrender.com/api/products/search?q=${encodeURIComponent(query)}`);
                const products = await response.json();

                grid.innerHTML = ''; // Clear "Searching..." message
                countP.textContent = `${products.length} results found.`;

                if (products.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center">No products matched your search.</p>';
                    return;
                }

                products.forEach(product => {
                    const imageUrl = (product.media && product.media.length > 0) ? product.media[0].url : 'https://placehold.co/600x750/E2E8F0/111827?text=Image';
                    const productCard = `
                        <a href="./product.html?id=${product._id}" class="group">
                            <div class="aspect-w-1 aspect-h-1 w-full overflow-hidden rounded-lg bg-gray-200">
                                <img src="${imageUrl}" alt="${product.name}" class="h-full w-full object-cover object-center group-hover:opacity-75">
                            </div>
                            <h3 class="mt-4 text-sm text-gray-700">${product.name}</h3>
                            <p class="mt-1 text-lg font-medium text-gray-900">₹${product.price.toFixed(2)}</p>
                        </a>
                    `;
                    grid.innerHTML += productCard;
                });

            } catch (error) {
                console.error('Error during search:', error);
                grid.innerHTML = '<p class="col-span-full text-center text-red-500">There was an error performing the search.</p>';
            }
        }

        function getCart() { return JSON.parse(localStorage.getItem('moreTrendzCart')) || []; }
        function updateCartIcon() { const cart = getCart(); const cartCountElement = document.getElementById('cart-count'); const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0); cartCountElement.textContent = totalItems; }
    </script>
        <script type="module" src="/js/main.js" defer></script>
</body>
